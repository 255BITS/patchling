name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          # npm test compares package.json to vX.Y.Z tags. A depth-1 checkout
          # does not fetch them, so a released 0.3.0 looks unreleased.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  benchmark:
    name: Benchmark (deterministic apply)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: node benchmark/run.js

  release:
    name: Version and changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pushed tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/check-release-version.mjs --tag "${GITHUB_REF_NAME}"
      - name: main is the latest tag or ahead with an unreleased changelog entry
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: node scripts/check-release-version.mjs --main
